name: ORCUS CI

# Pipeline experiment synchronization marker: 2026-11-28T05:38Z

on:
  push:
    branches: [main]
    paths-ignore:
      - STATUS.md
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install synthesis, simulation, and OpenSTA build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys iverilog build-essential cmake tcl-dev swig bison flex libeigen3-dev libfmt-dev zlib1g-dev autoconf automake libtool libfl-dev

      - name: Cache pinned CUDD and OpenSTA builds
        id: eda-cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/cudd-install
            /tmp/opensta-install
          key: eda-${{ runner.os }}-cudd-3.0.0-opensta-28d7a0b5123d59cbff8c1def4e3830c840fe5d50-v1

      - name: Build pinned CUDD dependency
        if: steps.eda-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 3.0.0 https://github.com/cuddorg/cudd.git /tmp/cudd-src
          cd /tmp/cudd-src
          autoreconf -fi
          ./configure --prefix=/tmp/cudd-install
          make -j2
          make install

      - name: Build pinned OpenSTA with VCD activity support
        if: steps.eda-cache.outputs.cache-hit != 'true'
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/parallaxsw/OpenSTA.git /tmp/opensta-src
          git -C /tmp/opensta-src fetch --depth 1 origin 28d7a0b5123d59cbff8c1def4e3830c840fe5d50
          git -C /tmp/opensta-src checkout --detach 28d7a0b5123d59cbff8c1def4e3830c840fe5d50
          cmake -S /tmp/opensta-src -B /tmp/opensta-build \
            -DCUDD_DIR=/tmp/cudd-install \
            -DCMAKE_INSTALL_PREFIX=/tmp/opensta-install \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/opensta-build --parallel 2
          cmake --install /tmp/opensta-build
          /tmp/opensta-install/bin/sta -version

      - name: Verify cached or newly built OpenSTA
        run: |
          test -x /tmp/opensta-install/bin/sta
          /tmp/opensta-install/bin/sta -version

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile all Python modules
        run: python -m compileall -q orcus tests examples benchmarks

      - name: Fetch Nangate45 research Liberty
        run: curl -fsSL https://raw.githubusercontent.com/The-OpenROAD-Project/OpenROAD-flow-scripts/master/flow/platforms/nangate45/lib/NangateOpenCellLibrary_typical.lib -o /tmp/NangateOpenCellLibrary_typical.lib

      - name: Run signed INT4 dot-product reduction benchmark
        run: python -u benchmarks/signed_int4_dot_product.py --require-tools --require-physical --sta /tmp/opensta-install/bin/sta --liberty /tmp/NangateOpenCellLibrary_typical.lib --output /tmp/orcus-int4-dot-product.json

      - name: Upload signed INT4 benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: orcus-signed-int4-dot-product
          path: /tmp/orcus-int4-dot-product.json
          if-no-files-found: error

      - name: Run 8/16/32-lane INT4 scaling benchmark
        run: python -u benchmarks/int4_lane_scaling.py --require-tools --require-physical --sta /tmp/opensta-install/bin/sta --liberty /tmp/NangateOpenCellLibrary_typical.lib --output /tmp/orcus-int4-lane-scaling.json

      - name: Upload lane-scaling benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: orcus-int4-lane-scaling
          path: /tmp/orcus-int4-lane-scaling.json
          if-no-files-found: error

      - name: Verify benchmark targets
        run: python -m orcus benchmark --max-gates 7 --output /tmp/orcus-ci-smoke.jsonl

  fpga-ecp5:
    name: ORCUS FPGA ECP5 place-and-route
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned Yosys and nextpnr ECP5 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys=0.33-5build2 nextpnr-ecp5=0.6-3build5 nextpnr-ecp5-chipdb=0.6-3build5 iverilog
          yosys -V
          nextpnr-ecp5 --version

      - name: Test FPGA wrapper and report parser
        run: python -m unittest discover -s tests -p 'test_fpga_ecp5.py' -v

      - name: Test pipelined Dadda generator and sequential harness
        run: python -m unittest discover -s tests -p 'test_dadda_pipeline.py' -v

      - name: Run 4/8/16/32-lane pipelined Dadda formal, streaming, synthesis, and place-and-route
        run: |
          python -u benchmarks/fpga_ecp5_pipeline.py --freq 100 --seed 1 \
            --outdir /tmp/orcus-fpga-ecp5-pipelined-dadda/runs \
            --output /tmp/orcus-fpga-ecp5-pipelined-dadda/results.json

      - name: Upload pipelined Dadda ECP5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orcus-fpga-ecp5-pipelined-dadda
          path: /tmp/orcus-fpga-ecp5-pipelined-dadda
          if-no-files-found: warn

      - name: Test ORCUS A/B operand scratchpad RTL
        run: python -m unittest discover -s tests -p 'test_operand_scratchpad_rtl.py' -v

      - name: Test ORCUS K-loop controller and synchronous tag alignment
        run: python -m unittest discover -s tests -p 'test_kloop_controller_rtl.py' -v

      - name: Prove scratchpad DP16KD inference and place 32-lane harness
        run: python -u benchmarks/fpga_ecp5_scratchpad.py --require-tools --freq 100 --seed 1 --outdir /tmp/orcus-fpga-ecp5-scratchpad

      - name: Upload scratchpad ECP5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orcus-fpga-ecp5-scratchpad
          path: /tmp/orcus-fpga-ecp5-scratchpad
          if-no-files-found: warn

      - name: Run 4/8/16/32-lane ECP5 synthesis and place-and-route
        run: |
          python -u benchmarks/fpga_ecp5.py --require-tools --freq 100 --seed 1 \
            --outdir /tmp/orcus-fpga-ecp5/runs \
            --output /tmp/orcus-fpga-ecp5/results.json

      - name: Upload ECP5 FPGA implementation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orcus-fpga-ecp5-pnr
          path: /tmp/orcus-fpga-ecp5
          if-no-files-found: warn
